<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brooswit Factory</title>
<meta name="description" content="Brooswit Factory: butchr, cleavr and drovr.">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#555; --link:#0b5fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#aaa; --link:#7db1ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; text-align:center; }
  main { max-width:960px; margin:0 auto; padding:0 16px 48px; }
  img { max-width:100%; height:auto; }
  .banner { width:100%; display:block; }
  .factory-logo { max-width:min(100%,600px); margin:24px auto 8px; display:block; }
  .tools { display:flex; justify-content:center; gap:32px; flex-wrap:wrap; margin:24px 0; }
  .tools a { text-decoration:none; color:var(--fg); }
  .tools img { height:96px; width:96px; display:block; margin:0 auto 4px; }
  a { color:var(--link); }
  p { color:var(--muted); }
</style>
</head>
<body>
<img class="banner" src="assets/factoryheader.jpg" alt="Brooswit Factory">
<main>
  <img class="factory-logo" src="assets/factory-logo.png" alt="Brooswit's Factory logo">
  <p>Brooswit Factory is a set of tools for running AI agents as a software team.</p>
  <nav class="tools" aria-label="Factory tools">
    <a href="https://github.com/brooswit-factory/butchr"><img src="assets/butchr-logo.png" alt="">butchr</a>
    <a href="https://github.com/brooswit-factory/cleavr"><img src="assets/cleavr-logo.png" alt="">cleavr</a>
    <a href="https://github.com/brooswit-factory/drovr"><img src="assets/drovr-logo.png" alt="">drovr</a>
  </nav>
  <p><a href="https://github.com/brooswit-factory/cleavr/releases">Cleavr releases</a></p>
</main>
</body>
</html>
